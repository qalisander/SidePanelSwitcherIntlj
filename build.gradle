plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

group 'switcher.intellij'
version '1.0.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2026.1.2') {
            useInstaller = false
        }
        jetbrainsRuntime()
    }
    testImplementation 'junit:junit:4.13.2'
}

// See https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
// https://plugins.jetbrains.com/docs/intellij/publishing-plugin.html#publishing-to-the-jetbrains-plugins-repository
// https://plugins.jetbrains.com/docs/intellij/deployment.html#using-environment-variables
intellijPlatform {
    pluginConfiguration {
        version = project.version
        ideaVersion {
            sinceBuild = '261'
            untilBuild = provider { null }
        }
        changeNotes = """
          <dl>
            <dt>Version 1.0.3</dt>
            <dd>Compatibility with IntelliJ IDEA 2026.1.x.</dd>
            <dd>Removed upper IDE version bound — plugin now loads in all future IntelliJ builds &ge; 2026.1.</dd>
            <dd>Fix SwitchBase class initialization error: fetch AppSettingsState on-demand instead of in a static field, avoiding a &lt;clinit&gt; failure during keymap lookup (<a href="https://github.com/qalisander/SidePanelSwitcherIntlj/pull/1">#1</a>, thanks @Sun-Phil-Kwon-Miro).</dd>
          </dl>"""
    }
    publishing {
        channels = ['beta']
        token = providers.environmentVariable('ORG_GRADLE_PROJECT_intellijPublishToken')
    }
}
